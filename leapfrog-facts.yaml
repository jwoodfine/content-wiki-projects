# leapfrog-facts.yaml — Did You Know panel for projects.woodfinegroup.com home page
#
# Rendered as the right-column panel on the home page (label rendered by
# the engine; this YAML supplies the body bullets). Engine reads on each
# request; absent → suppress panel; present → render bulleted list with
# optional wikilink anchors.
#
# Schema:
#   facts:
#     - text: <one sentence drawn from a TOPIC, deal-pipeline register, no marketing copy>
#       link_slug: <slug of the source TOPIC for [more] link>
#
# Reader: institutional financial community — REIT analyst, private-equity
# real-asset desk, sovereign-wealth real estate allocator. Each fact should
# carry quantitative or scarcity signal that frames a deal-relevant pattern.
#
# Updated: 2026-05-09 by project-editorial Task — initial publication
# Revised: 2026-08-25 by project-editorial Task — corrected stale cluster/location/
#   country counts against live project-gis pipeline data (see reference-invariants.yaml
#   revision of the same date for the verification trail)
# Rebuilt: 2026-09-06 by project-editorial (Track-B Phase 5 homepage sweep). This panel
#   had not been swept during Track-B and was the most stale surface on the wiki. Every
#   `link_slug` still carried the `topic-` prefix retired in the Batch B1 Part 4 migration;
#   three of the seven named articles no longer exist at all (tier-index-north-america,
#   tier-index-europe, co-location-index-canada — replaced by the atlas-* set in the
#   markets restructure); and four of the seven fact texts asserted the "Tier 5"
#   points-based vocabulary retired platform-wide on 2026-05-16, together with the
#   specific score values ("3.7% of total anchor locations", "exactly 102 Tier 5 sites",
#   "0 Tier 5 count") that commit 5e6d9c7 removed wiki-wide as stale and wrong. A seventh
#   asserted the 7,567-cluster figure redacted from the corpus earlier the same day
#   (commit 9a3221d) on the grounds that a wiki snapshot goes stale between processing runs.
#
#   Kept: the co-location-methodology and site-ledger-integration facts — both texts were
#   already accurate and free of retired vocabulary; only their slugs needed the prefix
#   dropped. Added three replacements drawn from live articles, carrying the current
#   four-tier predicate-gate vocabulary (Regional, District, Local, Fringe) and no
#   pipeline counts, since counts belong on the GIS platform rather than in a wiki snapshot.

facts:
  - text: "Every cluster carries one of four tiers — Regional, District, Local, or Fringe — assigned by a binary predicate gate rather than an accumulated score: a site either clears the anchor-adjacency test or it does not."
    link_slug: co-location-intelligence-overview

  - text: "A cluster's tier depends on where it stands against every other cluster in its own country, not against a fixed global threshold — a nationally significant cluster in a small market is read against its own national field rather than swamped by a larger one."
    link_slug: co-location-ranking-system

  - text: "The co-location methodology rejects analyst forecasts entirely: every node is validated by the independent capital commitments of named national-format retailers — operators that apply rigorous traffic-count and demographic analysis before any site selection."
    link_slug: co-location-methodology

  - text: "Every parcel is acquired against a verified entitlement position and an active development timeline — speculative land banking is prohibited by the acquisition model, not just by policy."
    link_slug: zoning-acquisition-rules

  - text: "Every Woodfine development site generates an immutable daily construction audit trail — flat-text records that investors and regulators can independently verify, with no database dependency or retrospective rewrites permitted."
    link_slug: site-ledger-integration
