# leapfrog-facts.es.yaml — Panel "¿Sabías que?" para projects.woodfinegroup.com
#
# El motor lee este archivo en cada solicitud; si está ausente, suprime el panel.
# El operador rota los hechos mensualmente; los más recientes van al inicio.
# Cada hecho debe citar un slug publicado y contener una afirmación
# independientemente verificable.
# Lector: comunidad financiera institucional — analista de REIT, mesa de
# activos reales de capital privado, asignador inmobiliario de fondos soberanos.
# Cada hecho debe transmitir señal cuantitativa o de escasez que enmarque
# un patrón relevante para operaciones.
#
# Creado: 2026-05-20 por project-editorial@claude-code
# Adaptación estratégica de leapfrog-facts.yaml para audiencias de
# América Latina y España.
# Reconstruido: 2026-09-06 por project-editorial (barrido de portada, fase 5 de Track-B).
#   Este panel arrastraba los mismos defectos que su par en inglés: tres de los siete
#   `link_slug` nombraban artículos que ya no existen (tier-index-north-america,
#   tier-index-europe, co-location-index-canada, sustituidos por el conjunto atlas-* en la
#   reestructuración de mercados) y cuatro textos afirmaban el vocabulario de "Nivel 5",
#   retirado de la plataforma el 2026-05-16, junto con valores de puntuación que se
#   eliminaron de toda la enciclopedia por obsoletos. Además, el primer hecho declaraba
#   7.594 clústeres en 13 países, cifras que contradecían a su propio par en inglés
#   (7.567 en 24 países) y que en cualquier caso quedaron redactadas del corpus el mismo
#   día (commit 9a3221d): los recuentos viven en la plataforma GIS, no en una instantánea
#   de la enciclopedia. Los cinco hechos vigentes son ahora los mismos que en inglés, con
#   el vocabulario actual de cuatro niveles (Regional, Distrito, Local, Periférico).

facts:
  - text: "Cada clúster lleva uno de cuatro niveles — Regional, Distrito, Local o Periférico — asignado por una compuerta de predicado binaria y no por una puntuación acumulada: un sitio supera la prueba de adyacencia de anclas o no la supera."
    link_slug: co-location-intelligence-overview

  - text: "El nivel de un clúster depende de su posición frente a los demás clústeres de su propio país, no de un umbral global fijo — así, un clúster de importancia nacional en un mercado pequeño se mide contra su propio campo nacional en lugar de quedar eclipsado por uno mayor."
    link_slug: co-location-ranking-system

  - text: "La metodología de co-localización rechaza las previsiones de los analistas: cada nodo se valida mediante los compromisos de capital independientes de minoristas de formato nacional que aplican análisis riguroso de afluencia y datos demográficos antes de cualquier selección de sitio."
    link_slug: co-location-methodology

  - text: "Cada parcela se adquiere contra una posición de habilitación urbanística verificada y un calendario de desarrollo activo — la retención especulativa de suelo está prohibida por el modelo de adquisición, no sólo por política interna."
    link_slug: zoning-acquisition-rules

  - text: "Cada sitio de desarrollo de Woodfine genera un registro diario inmutable de auditoría de construcción: registros en texto plano que inversores y reguladores pueden verificar de forma independiente, sin dependencia de bases de datos ni reescrituras retroactivas."
    link_slug: site-ledger-integration
